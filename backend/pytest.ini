[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Database: settings_test.py pins SQLite in-memory — nothing reads an env var here.
# (An `env =` block would require the pytest-env plugin, which CI does not install;
# with --strict-config the unknown option aborts the whole run.)

# Test discovery patterns
testpaths = tests

# Coverage configuration
addopts = 
    --strict-markers
    --strict-config
    --cov=rooms
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --reuse-db
    -v

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may use database)
    e2e: End-to-end tests (slowest, full workflows)
    slow: Slow tests that may take more than 1 second
    timezone: Tests related to timezone handling

# Coverage options
[coverage:run]
source = .
omit = 
    */migrations/*
    */tests/*
    */__pycache__/*
    */venv/*
    */env/*
    manage.py
    */config/settings/*
    */config/wsgi.py
    */config/asgi.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
