services:
  - type: web
    name: konfequem-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && cd backend && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: konfequem-db
          property: connectionString
      - key: ALLOWED_HOSTS
        fromService:
          name: konfequem-backend
          type: web
          property: host
      - key: CORS_ALLOWED_ORIGINS
        value: https://konfequem-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://konfequem-frontend.onrender.com
      - key: PYTHON_VERSION
        value: "3.11"

  - type: web
    name: konfequem-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_BACKEND_URL
        value: https://konfequem-backend.onrender.com

databases:
  - name: konfequem-db
    plan: free
    postgresMajorVersion: 15
