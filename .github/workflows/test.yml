name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      
      - name: Run flake8 linting
        working-directory: ./backend
        run: |
          flake8 rooms config tests --exclude=migrations --max-line-length=88 --extend-ignore=E203,W503
      
      - name: Run black format check
        working-directory: ./backend
        run: |
          black rooms config tests --check --exclude=migrations
        continue-on-error: true
      
      - name: Create .env file
        working-directory: ./backend
        run: |
          echo "DJANGO_SECRET_KEY=test-secret-key-for-ci" > .env
          echo "DJANGO_DEBUG=True" >> .env
          echo "DATABASE_URL=postgres://testuser:testpass@localhost:5432/testdb" >> .env
          echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> .env
      
      - name: Run migrations
        working-directory: ./backend
        run: |
          python manage.py migrate --noinput
      
      - name: Run pytest with coverage
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb
        run: |
          pytest tests/ -v --cov=rooms --cov-report=term-missing --cov-report=xml --cov-report=html
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
      
      - name: Archive coverage reports
        uses: actions/upload-artifact@v3
        with:
          name: backend-coverage-reports
          path: backend/htmlcov/

  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true
      
      - name: Run Vitest with coverage
        working-directory: ./frontend
        run: npm run test:coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
      
      - name: Archive coverage reports
        uses: actions/upload-artifact@v3
        with:
          name: frontend-coverage-reports
          path: frontend/coverage/

  coverage-check:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
      - name: Check coverage thresholds
        run: |
          echo "Coverage reports have been generated"
          echo "Backend and frontend coverage jobs completed successfully"
