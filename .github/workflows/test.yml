name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run flake8
        working-directory: ./backend
        run: flake8 rooms config tests --exclude=migrations --max-line-length=88 --extend-ignore=E203,W503

      - name: Run black check
        working-directory: ./backend
        run: black rooms config tests --check --exclude=migrations

      - name: Create .env file
        working-directory: ./backend
        run: |
          echo "DJANGO_SECRET_KEY=test-secret-key-for-ci" > .env
          echo "DJANGO_DEBUG=True" >> .env
          echo "DATABASE_URL=postgres://testuser:testpass@localhost:5432/testdb" >> .env
          echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> .env

      - name: Run migrations
        working-directory: ./backend
        run: python manage.py migrate --noinput

      - name: Run pytest
        working-directory: ./backend
        run: pytest tests/ -v --cov=rooms --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run tests
        working-directory: ./frontend
        run: npx vitest run

      - name: Build
        working-directory: ./frontend
        run: npm run build
