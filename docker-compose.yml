services:
  db:
    image: postgres:15
    container_name: konfequem_db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d konfequem"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: konfequem
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    container_name: konfequem_backend
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build: ./frontend
    container_name: konfequem_frontend
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
